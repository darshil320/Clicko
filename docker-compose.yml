# Local development only. Production hosting: docs/DECISIONS/0008-hosting-at-launch.md
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: clickco
      POSTGRES_PASSWORD: clickco_local_only
      POSTGRES_DB: clickco
    ports: ["127.0.0.1:5433:5432"] # localhost only; 5433 avoids a host Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickco -d clickco"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "clickco_local_only"]
    ports: ["127.0.0.1:6380:6379"] # localhost only; 6380 avoids a host Redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "clickco_local_only", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
