packages:
  - "apps/*"
  - "packages/*"
# Packages allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
  msgpackr-extract: true # optional native speed-up used by bullmq
# pnpm 11 holds back releases younger than its minimum age; these pins were
# reviewed at scaffold time (21 Oct 2026).
minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.2"
  - "@biomejs/cli-android-arm64@2.6.2"
  - "@biomejs/cli-android-x64@2.6.2"
  - "@biomejs/cli-darwin-arm64@2.6.2"
  - "@biomejs/cli-darwin-x64@2.6.2"
  - "@biomejs/cli-linux-arm64-musl@2.6.2"
  - "@biomejs/cli-linux-arm64@2.6.2"
  - "@biomejs/cli-linux-x64-musl@2.6.2"
  - "@biomejs/cli-linux-x64@2.6.2"
  - "@biomejs/cli-win32-arm64@2.6.2"
  - "@biomejs/cli-win32-x64@2.6.2"
  - "@turbo/darwin-64@2.11.10"
  - "@turbo/darwin-arm64@2.11.10"
  - "@turbo/linux-64@2.11.10"
  - "@turbo/linux-arm64@2.11.10"
  - "@turbo/windows-64@2.11.10"
  - "@turbo/windows-arm64@2.11.10"
  - turbo@2.11.10
  - lucide-react@1.63.0
# Security overrides (pnpm audit, 30 Oct 2026): patched transitive versions. body-parser and multer
# sit inside @nestjs/platform-express (the API's HTTP layer); the rest are Expo build tooling.
# Accepted advisories (ADR-0027 D6). GHSA-mrhx-c7xc-m3w5 (zod <4.6.6, memory on oversized
# collections): only zod 3.25.x inside @expo/cli (Expo's build tooling, never in an app bundle and
# never fed untrusted input). No patched 3.x exists and @expo/cli needs the v3 API. Clickco's own
# zod is 4.6.7. Drop this when Expo moves to zod 4.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
overrides:
  "body-parser@>=2.0.0 <2.4.0": 2.4.0
  "multer@>=2.0.0 <2.5.0": 2.5.0
  "node-forge@<=1.4.0": 1.4.2
  "decode-uri-component@<=0.5.0": 0.5.1
